# Splunk inputs.conf - SOC Lab
# Location on Splunk host: $SPLUNK_HOME/etc/system/local/inputs.conf
# After editing, restart Splunkd for changes to take effect.

[WinEventLog://Application]
disabled = 0
index = main

[WinEventLog://Security]
disabled = 0
index = main

[WinEventLog://System]
disabled = 0
index = main

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = main
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
renderXml = true
# Note: After installing the Splunk Add-on for Sysmon, the effective
# sourcetype is rewritten to lowercase 'xmlwineventlog' on ingest.
# All detection searches reference this rewritten sourcetype.